name: Build

on:
  push:
    branches: [ "dev" ]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }} 

jobs:
  Linux-App:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - run: |
          rustup set auto-self-update disable
          rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@v2
      with:
        key: "v1-ubuntu-22.04-x86_64"
    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          binutils build-essential curl desktop-file-utils libegl-dev libegl-mesa0 \
          libfontconfig1-dev libfreetype6-dev libgl1-mesa-dri libudev-dev \
          libxkbcommon-x11-0 pkg-config
    - name: Install Linux GUI test tools
      continue-on-error: true
      run: sudo apt-get install --no-install-recommends -y xauth xdotool xvfb mesa-utils
    - name: Build and package Linux AppImage
      run: bash ./.github/scripts/build-linux-appimage.sh
    - name: Verify Linux AppImage and application startup
      run: bash ./.github/scripts/verify-linux-appimage.sh target/appimage/config_app.AppImage
      env:
        WGPU_BACKEND: gl
    - uses: actions/upload-artifact@v7
      with:
        path: target/appimage/config_app.AppImage
        name: config-app-linux
        if-no-files-found: error

  Windows-App:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        # Stop on every native command failure, even when another command follows.
        shell: >-
          pwsh -NoLogo -NoProfile -NonInteractive -Command
          "$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: win32
      - name: Install latest stable Rust and Windows x86 target
        run: |
          rustup set auto-self-update disable
          rustup toolchain install stable --profile minimal --target i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: "v1-windows-i686-msvc-${{ env.VCToolsVersion }}-sdk-${{ env.UCRTVersion }}"
      - name: Build executable
        run: cargo build --verbose --release --package config_app --bin config_app --target i686-pc-windows-msvc
      - name: Install Mesa llvmpipe for Windows GUI smoke test
        id: mesa
        continue-on-error: true
        if: runner.environment == 'github-hosted'
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa-llvmpipe-x86-26.2.5.7z'
          $mesaDir = Join-Path $env:RUNNER_TEMP 'mesa-llvmpipe-x86'
          $sevenZip = Join-Path $env:RUNNER_TEMP '7zr.exe'
          $releaseDir = (Resolve-Path 'target/i686-pc-windows-msvc/release').Path
          $mesaDll = Join-Path $releaseDir 'opengl32.dll'
          $url = 'https://github.com/mmozeiko/build-mesa/releases/download/26.2.5/mesa-llvmpipe-x86-26.2.5.7z'
          $sha256 = '1858bce8a19c5d337dc4c9db039ef5e2f98d82dbb6e100dbe51564e8bc3572a4'
          $sevenZipUrl = 'https://github.com/ip7z/7zip/releases/download/26.04/7zr.exe'
          $sevenZipSha256 = '256feca8e274e5da655e2a284fabafd9f554365eb164862089dacd4e8276d282'

          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $sha256) {
            throw 'Mesa llvmpipe archive SHA-256 does not match the pinned release.'
          }
          Invoke-WebRequest -Uri $sevenZipUrl -OutFile $sevenZip
          if ((Get-FileHash -LiteralPath $sevenZip -Algorithm SHA256).Hash -ne $sevenZipSha256) {
            throw '7-Zip extractor SHA-256 does not match the pinned release.'
          }

          if (Test-Path -LiteralPath $mesaDll) {
            throw "Unexpected OpenGL runtime already exists: $mesaDll"
          }
          New-Item -ItemType Directory -Path $mesaDir -Force | Out-Null
          & $sevenZip x $archive "-o$mesaDir" -y
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not extract the pinned Mesa llvmpipe archive.'
          }
          $mesaSourceDll = Join-Path $mesaDir 'opengl32.dll'
          if (-not (Test-Path -LiteralPath $mesaSourceDll)) {
            throw 'Mesa llvmpipe archive does not contain opengl32.dll.'
          }
          Add-Content -Path $env:GITHUB_ENV -Value 'WGPU_BACKEND=gl'
          Add-Content -Path $env:GITHUB_ENV -Value 'MESA_RUNTIME_INSTALLED=true'
          Copy-Item -LiteralPath $mesaSourceDll -Destination $mesaDll
      - name: View artifacts
        run: Get-Item target/i686-pc-windows-msvc/release/config_app.exe
      - name: Verify Windows executable and GUI startup
        run: ./.github/scripts/verify-windows-exe.ps1 target/i686-pc-windows-msvc/release/config_app.exe
        env:
          SKIP_GUI_STARTUP: ${{ steps.mesa.outcome == 'failure' && '1' || '0' }}
      - name: Remove Mesa runtime after GUI smoke test
        if: always() && runner.environment == 'github-hosted'
        run: |
          if ($env:MESA_RUNTIME_INSTALLED -eq 'true') {
            Remove-Item target/i686-pc-windows-msvc/release/opengl32.dll -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v7
        with:
          name: config-app-exe
          path: target/i686-pc-windows-msvc/release/config_app.exe
          if-no-files-found: error

  OSX-app:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: macos-latest # Apple Silicon (ARM64)
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup set auto-self-update disable
          rustup toolchain install stable --profile minimal
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: Swatinem/rust-cache@v2
        with:
          key: "v4-macos-arm64-static-ssl"
      - name: Install cargo-bundle
        run: cargo install cargo-bundle --version 0.12.0 --locked
      - name: Build Apple Silicon app and DMG
        run: |
          cargo build --release --package config_app
          cargo bundle --release --package config_app --binary-path target/release/config_app --format dmg
          mv target/release/bundle/dmg/Ultimate-NAG52-Config-App.dmg target/release/bundle/dmg/config_app.dmg
        env:
          OPENSSL_STATIC: "1"
      - name: Verify macOS disk image and bundled executable
        run: bash .github/scripts/verify-macos-dmg.sh target/release/bundle/dmg/config_app.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: config-app-osx
          path: target/release/bundle/dmg/config_app.dmg
          if-no-files-found: error

  Create-Upload:
    needs: [Windows-App, Linux-App, OSX-app]
    runs-on: ubuntu-latest
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v8
      with:
        name: config-app-exe
    - name: Download Linux artifact
      uses: actions/download-artifact@v8
      with:
        name: config-app-linux
    - name: Download OSX artifact
      uses: actions/download-artifact@v8
      with:
        name: config-app-osx
    - name: View artifacts
      run: ls -R
    - name: Create release and upload assets
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || format('{0}-{1}', env.BRANCH_NAME, github.sha) }}
        target_commitish: ${{ github.sha }}
        name: ${{ github.event_name == 'release' && github.event.release.name || format('Release {0}', env.BRANCH_NAME) }}
        draft: false
        prerelease: ${{ (github.event_name == 'release' && github.event.release.prerelease) || (github.event_name != 'release' && env.BRANCH_NAME != 'main') }}
        files: |
          *.exe
          *.AppImage
          *.dmg
      
          
       
